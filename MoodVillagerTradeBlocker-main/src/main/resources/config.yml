# Ces livres restent disponibles, mais leur prix minimum en émeraudes est forcé.
# Avec une émeraude à 1200€, MENDING à 64 émeraudes vaut environ 76 800€.
expensive-enchanted-books:
  MENDING: 64
  FORTUNE: 56
  SILK_TOUCH: 48
  EFFICIENCY: 48
  UNBREAKING: 48
  LOOTING: 56
