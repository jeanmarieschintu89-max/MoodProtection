# MoodVillagerTradeBlocker
# Objectif: empêcher les échanges villageois qui cassent l'économie.

settings:
  notify-admins: false
  remove-empty-villagers: false

  # Recommandé: true.
  # Bloque tous les trades où le villageois DONNE des émeraudes.
  # Les trades où le villageois DEMANDE des émeraudes restent autorisés,
  # sauf si le résultat est dans blocked-result-items.
  block-all-emerald-results: true

# Supprime les trades dont le résultat donne ces items.
# Ici on bloque surtout les ressources liées à la bourse et les équipements trop forts.
blocked-result-items:
  - EMERALD_BLOCK
  - DIAMOND
  - DIAMOND_BLOCK
  - DIAMOND_SWORD
  - DIAMOND_PICKAXE
  - DIAMOND_AXE
  - DIAMOND_SHOVEL
  - DIAMOND_HOE
  - DIAMOND_HELMET
  - DIAMOND_CHESTPLATE
  - DIAMOND_LEGGINGS
  - DIAMOND_BOOTS
  - IRON_INGOT
  - IRON_BLOCK
  - GOLD_INGOT
  - GOLD_BLOCK
  - COPPER_INGOT
  - COPPER_BLOCK
  - REDSTONE
  - REDSTONE_BLOCK
  - LAPIS_LAZULI
  - LAPIS_BLOCK
  - QUARTZ
  - COAL
  - COAL_BLOCK
  - AMETHYST_SHARD
  - NETHERITE_INGOT
  - NETHERITE_SCRAP
  - NETHERITE_UPGRADE_SMITHING_TEMPLATE

# Si block-all-emerald-results est false, cette liste bloque seulement
# les trades où ces ingrédients donnent une émeraude.
# Elle reste utile pour une politique moins stricte.
